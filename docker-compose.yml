version: '3.8'

services:
  olympo-db:
    image: postgres:15-alpine
    container_name: olympo_postgres_local
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - olympo_db_data:/var/lib/postgresql/data
    restart: always

volumes:
  olympo_db_data: